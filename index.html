<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c2241">
  <title>온누리 안드로이드 포스 | 온팜 포스 브로슈어</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: system-ui, -apple-system, 'Malgun Gothic', sans-serif; color: white; background: #0b1c38; }
    .book { display: flex; flex-direction: column; height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }
    header { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; gap:12px; padding:11px 18px; background: #0b1c38; border-bottom: 1px solid #33435b; }
    header h1 { margin:0; font-size:15px; font-weight:600; white-space:nowrap; }
    header .hint { font-size:12px; opacity:.75; }
    .viewer { display:flex; align-items:center; justify-content:center; flex:1 1 auto; min-height:0; overflow:hidden; position:relative; touch-action:pan-y pinch-zoom; }
    .viewer img { display:block; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; box-shadow:0 0 30px rgba(0,0,0,.2); user-select:none; -webkit-user-drag:none; }
    .arrow { position:absolute; z-index:2; top:50%; transform:translateY(-50%); width:46px; height:60px; border:0; border-radius:8px; background:#06172b99; color:#fff; font-size:34px; cursor:pointer; }
    .arrow:hover { background:#18345acc; }
    .arrow:disabled { cursor:default; opacity:.2; }
    .prev { left: max(8px, env(safe-area-inset-left)); }
    .next { right: max(8px, env(safe-area-inset-right)); }
    footer { display:flex; justify-content:center; align-items:center; flex-shrink:0; height:50px; padding:7px 14px max(7px, env(safe-area-inset-bottom)); border-top:1px solid #33435b; background:#0b1c38; gap:18px; }
    footer button { border:1px solid #60718c; background:transparent; color:white; padding:6px 14px; font-size:14px; border-radius:7px; cursor:pointer; }
    footer button:disabled { opacity:.3; cursor:default; }
    #counter { text-align:center; min-width:55px; font-size:13px; font-variant-numeric: tabular-nums; }
    @media(max-width:600px) {
      header { padding:8px 12px; }
      header h1 { font-size:13px; }
      header .hint { font-size:11px; }
      .arrow { width:31px; height:48px; font-size:27px; background:#06172b99; }
      footer { height:46px; gap:22px; }
    }
  </style>
</head>
<body>
  <main class="book">
    <header><h1>온누리 안드로이드 포스</h1><span class="hint">좌우로 넘겨 보세요</span></header>
    <section class="viewer" id="viewer" aria-label="브로슈어 페이지">
      <button type="button" class="arrow prev" id="prev" aria-label="이전 페이지">‹</button>
      <img src="01.jpg" id="page" alt="온팜 포스 브로슈어 1페이지" draggable="false">
      <button type="button" class="arrow next" id="next" aria-label="다음 페이지">›</button>
    </section>
    <footer>
      <button type="button" id="prevBottom">이전</button>
      <span id="counter" aria-live="polite">1 / 8</span>
      <button type="button" id="nextBottom">다음</button>
    </footer>
  </main>
  <script>
    const pages = Array.from({length: 8}, (_, i) => `${String(i + 1).padStart(2, '0')}.jpg`);
    let index = 0;
    const page = document.getElementById('page');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const prevBottom = document.getElementById('prevBottom');
    const nextBottom = document.getElementById('nextBottom');
    function show(n) {
      if (n < 0 || n >= pages.length) return;
      index = n;
      page.src = pages[index];
      page.alt = `온팜 포스 브로슈어 ${index + 1}페이지`;
      counter.textContent = `${index + 1} / ${pages.length}`;
      prev.disabled = prevBottom.disabled = index === 0;
      next.disabled = nextBottom.disabled = index === pages.length - 1;
      if (pages[index+1]) { const preload = new Image(); preload.src = pages[index+1]; }
    }
    prev.addEventListener('click', () => show(index-1));
    next.addEventListener('click', () => show(index+1));
    prevBottom.addEventListener('click', () => show(index-1));
    nextBottom.addEventListener('click', () => show(index+1));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') show(index - 1);
      else if (e.key === 'ArrowRight') show(index + 1);
    });
    const viewer = document.getElementById('viewer');
    let x0=0,y0=0;
    viewer.addEventListener('touchstart', (e) => {
      if(e.touches.length !== 1) return;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, {passive:true});
    viewer.addEventListener('touchend', (e) => {
      if (!e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - x0;
      const dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)*1.25) show(index + (dx < 0 ? 1 : -1));
    }, {passive:true});
    show(0);
  </script>
</body>
</html>
