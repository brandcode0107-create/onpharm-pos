<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e213d">
  <title>온누리 안드로이드 포스 | 브로슈어</title>
  <style>
    :root { color-scheme: light; --navy: #0e213d; --ink: #15253e; --muted: #66778d; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { font-family: system-ui, -apple-system, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: #edf2f8; color: var(--ink); }
    .viewer { height: 100vh; height: 100dvh; min-height: 320px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap: 12px; padding: 12px 20px; min-height: 58px; background: var(--navy); color: #fff; }
    .title { font-size: clamp(14px, 3.7vw, 18px); font-weight: 700; letter-spacing: -.035em; }
    .sub { font-size: 12px; color: #c4d3e7; white-space: nowrap; }
    .stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; padding: 12px 76px; }
    .page { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; box-shadow: 0 6px 24px rgba(20, 39, 64, .16); background: white; }
    .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border: 1px solid #ced9e6; border-radius: 50%; background: rgba(255,255,255,.95); color: var(--navy); font-size: 31px; line-height: 1; cursor: pointer; box-shadow: 0 2px 8px rgba(20,39,64,.10); display: grid; place-items:center; }
    .arrow:hover:not(:disabled) { background: #dcecff; }
    .arrow:disabled { cursor: default; opacity: .26; }
    .prev { left: 18px; } .next { right: 18px; }
    footer { display: flex; justify-content: center; align-items: center; gap: 18px; min-height: 58px; padding: 10px 16px max(10px, env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #dbe3ed; }
    .counter { min-width: 65px; font-size: 15px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
    .hint { font-size: 12px; color: var(--muted); }
    .dots { display: flex; gap: 6px; }
    .dot { appearance: none; border:0; padding:0; width: 7px; height: 7px; border-radius: 50%; background: #c5d1df; cursor: pointer; }
    .dot.active { width: 19px; border-radius: 20px; background: #128fc7; }
    @media(max-width:600px) {
      header { min-height: 50px; padding: 10px 13px; }
      .sub { font-size: 11px; }
      .stage { padding: 7px 3px; touch-action: pan-y; }
      .arrow { width: 36px; height: 36px; font-size: 24px; background: rgba(255,255,255,.80); }
      .prev { left: 6px; } .next { right: 6px; }
      .page { max-height: 100%; box-shadow: none; }
      footer { gap: 12px; flex-wrap: wrap; min-height: 54px; padding: 8px 10px max(8px,env(safe-area-inset-bottom)); }
      .hint { display: none; }
    }
    @media(prefers-reduced-motion: no-preference) { .page { transition: opacity .13s ease; } }
  </style>
</head>
<body>
  <div class="viewer">
    <header>
      <div class="title">온누리 안드로이드 포스</div>
      <div class="sub">제품 브로슈어</div>
    </header>
    <main class="stage" id="stage" aria-label="브로슈어 페이지 뷰어">
      <button class="arrow prev" id="prev" type="button" aria-label="이전 페이지">&#8249;</button>
      <img class="page" id="page" src="01.jpg" alt="온누리 안드로이드 포스 브로슈어 1페이지" draggable="false">
      <button class="arrow next" id="next" type="button" aria-label="다음 페이지">&#8250;</button>
    </main>
    <footer>
      <span class="counter" id="counter" aria-live="polite">1 / 8</span>
      <div class="dots" id="dots" aria-label="페이지 선택"></div>
      <span class="hint">← → 방향키 또는 화면 좌우 밀기</span>
    </footer>
  </div>
  <script>
    const pages = Array.from({ length: 8 }, (_, i) => String(i + 1).padStart(2, '0') + '.jpg');
    let current = 0;
    const img = document.getElementById('page');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const dots = document.getElementById('dots');
    pages.forEach((_, index) => {
      const dot = document.createElement('button');
      dot.type = 'button'; dot.className = 'dot'; dot.setAttribute('aria-label', `${index + 1}페이지로 이동`);
      dot.addEventListener('click', () => show(index));
      dots.appendChild(dot);
    });
    function show(index) {
      if (index < 0 || index >= pages.length) return;
      current = index;
      img.src = pages[current];
      img.alt = `온누리 안드로이드 포스 브로슈어 ${current + 1}페이지`;
      counter.textContent = `${current + 1} / ${pages.length}`;
      prev.disabled = current === 0;
      next.disabled = current === pages.length - 1;
      Array.from(dots.children).forEach((dot, i) => {
        dot.classList.toggle('active', i === current);
        dot.setAttribute('aria-current', i === current ? 'page' : 'false');
      });
      if (current + 1 < pages.length) { const preload = new Image(); preload.src = pages[current + 1]; }
    }
    prev.addEventListener('click', () => show(current - 1));
    next.addEventListener('click', () => show(current + 1));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); show(current + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(current - 1); }
    });
    const stage = document.getElementById('stage');
    let touchX = null, touchY = null;
    stage.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
    }, { passive: true });
    stage.addEventListener('touchend', (e) => {
      if (touchX === null || !e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) show(current + (dx < 0 ? 1 : -1));
      touchX = null; touchY = null;
    }, { passive: true });
    show(0);
  </script>
</body>
</html>
